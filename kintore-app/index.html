<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>筋トレ記録</title>
<meta name="theme-color" content="#2a2a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a2a2a;--panel:#323232;--line:#3c3c3c;--ink:#ecebe7;--mute:#9b9994;--faint:#5e5d5a;
  --sil:#242424;--lo:#474746;--hi:#efeee9;--accent:#d6b26a;--warn:#e08a6e;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f1ee;--panel:#ffffff;--line:#e2e0db;--ink:#232322;--mute:#6e6c67;--faint:#bdbab3;
    --sil:#e6e4df;--lo:#d3d0ca;--hi:#2b2b2a;--accent:#9c7428;--warn:#b5532f;color-scheme:light;
  }
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a2a2a;--panel:#323232;--line:#3c3c3c;--ink:#ecebe7;--mute:#9b9994;--faint:#5e5d5a;
    --sil:#242424;--lo:#474746;--hi:#efeee9;--accent:#d6b26a;--warn:#e08a6e;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2a2a2a;--panel:#323232;--line:#3c3c3c;--ink:#ecebe7;--mute:#9b9994;--faint:#5e5d5a;
  --sil:#242424;--lo:#474746;--hi:#efeee9;--accent:#d6b26a;--warn:#e08a6e;color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f1ee;--panel:#ffffff;--line:#e2e0db;--ink:#232322;--mute:#6e6c67;--faint:#bdbab3;
  --sil:#e6e4df;--lo:#d3d0ca;--hi:#2b2b2a;--accent:#9c7428;--warn:#b5532f;color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.num,.mnum,.bigdate,.stat b,.prow .v{font-family:"Jost","Futura","Avenir Next",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:520px;margin:0 auto;padding:28px 22px 120px}

/* 月ヘッダー */
.mhead{display:flex;align-items:flex-start;gap:18px;margin-bottom:26px}
.mnum{font-size:84px;font-weight:300;line-height:.86;letter-spacing:-.02em}
.mname{white-space:nowrap;font-family:"Jost",system-ui,sans-serif;font-size:12px;letter-spacing:.26em;color:var(--mute);margin-top:6px;font-weight:500}
.mnav{margin-left:auto;display:flex;gap:4px}
.nav{background:none;border:1px solid var(--line);border-radius:999px;width:38px;height:38px;color:var(--mute);font-size:18px;line-height:1}
.nav:hover{color:var(--ink)}

/* 記録画面 */
.dayhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:6px}
.bigdate{font-size:64px;font-weight:300;line-height:.9;letter-spacing:-.02em}
.bigdate span{color:var(--faint);margin:0 2px}
.dow{color:var(--mute);font-size:14px;padding-bottom:4px;white-space:nowrap}
.dayhead .mnav{align-self:center}
.phase{color:var(--mute);font-size:13px;margin:12px 0 18px;border-left:2px solid var(--accent);padding-left:10px}
.phase b{color:var(--ink);font-weight:500}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.today-btn{color:var(--accent);border-color:var(--accent)}

.entry{border-top:1px solid var(--line);padding:16px 0 14px}
.etop{display:flex;align-items:baseline;gap:10px}
.etop h3{margin:0;font-size:17px;font-weight:500}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
.x{margin-left:auto;background:none;border:none;color:var(--faint);font-size:20px;line-height:1;padding:4px 6px}
.x:hover{color:var(--warn)}
.target{font-size:12.5px;color:var(--mute);margin:2px 0 10px}
.sets{display:grid;grid-template-columns:20px 1fr 1fr 28px;gap:6px 10px;align-items:center}
.sets .sn{font-family:"Jost",sans-serif;color:var(--faint);font-size:13px;text-align:right}
.sets select,.sets input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px}
.sets input{font-family:"Jost",sans-serif}
.unit{position:relative}
.unit input{padding-right:46px}
.unit i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--mute);pointer-events:none}
.sx{background:none;border:none;color:var(--faint);font-size:16px;padding:0}
.erow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.mini{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--mute)}
.mini[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.upnote{color:var(--accent)}
.feel-label{font-size:12px;color:var(--faint);margin-right:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.btn{border:1px solid var(--ink);background:none;border-radius:999px;padding:9px 18px;font-size:14px}
.btn.solid{background:var(--ink);color:var(--bg)}
textarea{width:100%;min-height:72px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;resize:vertical}
.lbl{font-size:12px;color:var(--mute);margin:20px 0 6px;display:block}
.empty{color:var(--mute);font-size:14px;padding:18px 0;border-top:1px solid var(--line)}

/* カレンダー */
.stats{display:flex;gap:26px;align-items:baseline;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;color:var(--mute);font-size:14px}
.stat b{font-size:28px;font-weight:500;color:var(--ink)}
.sub{color:var(--mute);font-size:14px;margin:8px 0 26px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.cal .h{font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.18em;color:var(--mute);text-align:center;padding:0 0 10px;border:none;font-weight:500}
.calhead{display:grid;grid-template-columns:repeat(7,1fr)}
.calhead .sun{color:var(--accent)}
.cell{aspect-ratio:1/1.2;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;border-top:none;border-left:none;
  display:flex;flex-direction:column;align-items:center;padding:6px 2px;gap:4px}
.cell .d{font-family:"Jost",sans-serif;font-size:14px;color:var(--faint)}
.cell.on .d{color:var(--ink)}
.cell.out .d{color:var(--line)}
.cell.today{box-shadow:inset 0 0 0 1px var(--accent)}
.cell .ic{font-size:clamp(14px,5.6vw,26px);line-height:1;white-space:nowrap}
.cell .ic.two{font-size:clamp(11px,3.8vw,17px)}
.cell .ic.rest{font-size:11px;color:var(--faint)}

/* 部位 */
.big3{display:flex;gap:30px;margin:-4px 0 28px}
.big3 div{display:flex;flex-direction:column}
.big3 b{font-family:"Jost",sans-serif;font-size:52px;font-weight:300;line-height:1}
.big3 span{font-size:12px;color:var(--mute);margin-top:8px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;width:max-content;margin:0 auto 10px;padding:2px}
.seg button{background:none;border:none;border-radius:999px;padding:5px 18px;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bodyfig{margin:0 -10px 24px;text-align:center}
.bodyfig svg{width:100%;height:auto;max-height:540px}
.ptitle{font-size:13px;color:var(--mute);margin:0 0 10px}
.prow{padding:10px 0 12px}
.prow .t{display:flex;align-items:center;gap:10px}
.prow .sw{width:12px;height:12px;border-radius:2px}
.prow .n{font-size:17px}
.prow .v{margin-left:auto;font-size:20px}
.prow .df{width:44px;text-align:right;font-family:"Jost",sans-serif;font-size:13px;color:var(--faint)}
.track{position:relative;height:5px;background:var(--line);border-radius:3px;margin-top:8px}
.track .f{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#e7b9b1,#b3202c);border-radius:3px}
.track .p{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--mute)}
.note{font-size:12px;color:var(--faint);margin-top:6px}

/* 種目別 */
.grp{margin-bottom:26px}
.grp h3{margin:0 0 4px;font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.grp h3 small{font-size:12px;font-weight:400;color:var(--mute)}
.exr{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.exr .en{font-size:16px}
.exr .ed{text-align:right;font-size:13px;color:var(--mute)}
.exr .ed b{font-family:"Jost",sans-serif;color:var(--ink);font-weight:500}
.exr .dots{display:flex;gap:2px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.exr .dots i{width:9px;height:9px;border-radius:1.5px;background:var(--line);flex:none}
.exr .dots i.on{background:var(--hi)}
.exr .sp{text-align:right;font-family:"Jost",sans-serif;font-size:14px;font-weight:500}

/* その他 */
.sec{margin:0 0 30px}
.sec h2{font-size:15px;font-weight:700;margin:0 0 10px}
.sec p{color:var(--mute);font-size:13.5px;margin:0 0 10px}
.exedit{display:grid;grid-template-columns:1fr 96px 84px;gap:6px 8px;align-items:center;font-size:14px}
.exedit select,.exedit input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:14px;width:100%}
.scroll{overflow-x:auto}

/* シート */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
.sheet.open{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--bg);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:18px 22px calc(24px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.sheet h2{font-size:16px;margin:0 0 6px;display:flex;align-items:center}
.sheet h4{font-size:12px;color:var(--mute);font-weight:400;margin:16px 0 6px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:14px}
.newex{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.newex input,.newex select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;width:100%}
.newex .full{grid-column:1/-1}

/* タブ */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs .inr{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:none;padding:12px 0 14px;font-size:13px;color:var(--faint);border-top:2px solid transparent;margin-top:-1px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.status{font-size:12px;color:var(--faint);margin-top:28px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="種目を追加"><div class="in" id="sheetIn"></div></div>
<nav class="tabs" aria-label="画面切り替え"><div class="inr">
  <button data-tab="rec">記録</button>
  <button data-tab="cal">カレンダー</button>
  <button data-tab="parts">部位</button>
  <button data-tab="ex">種目</button>
  <button data-tab="more">設定</button>
</div></nav>
<script>
(function(){
"use strict";
/* ---------- 定数 ---------- */
var PARTS=["胸","背中","肩","腕","臀","脚","腹・体幹"];
var STAGES=[5,10,15,20,25,32,40,47,55,62,70,78,85,92,100];
var EXTRA={"レッグプレス":[35,50],"アシストディップス":[45,50],"ディップチンアシスト":[45]};
var HOME_W=[1,2,3,4,5,6,8,10];
var UNITS=["回","秒","左右回"];
var ASSIST=["アシストディップス","ディップチンアシスト"];
var MONTHS=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
var DOW=["日","月","火","水","木","金","土"];
var SHOW_RUN=false; /* ランの記録・表示（今は使わない） */

var DEFAULT_EX=[
 ["チェストプレス","胸","回",1],["インクラインチェストプレス","胸","回",1],["ペックデッキフライ","胸","回",1],["アシストディップス","胸","回",1],
 ["ラットプルダウン","背中","回",1],["シーテッドケーブルロウ","背中","回",1],["ディップチンアシスト","背中","回",1],
 ["ショルダープレス","肩","回",1],["リアデルトフライ","肩","回",1],
 ["アームカール","腕","回",1],
 ["ヒップスラスト","臀","回",1],["ヒップアブダクション","臀","回",1],
 ["レッグプレス","脚","回",1],["シーテッドレッグカール","脚","回",1],["レッグエクステンション","脚","回",1],["ヒップアダクション","脚","回",1],
 ["アブドミナルクランチ","腹・体幹","回",1],["デッドバグ","腹・体幹","回",0],["プランク","腹・体幹","左右回",0],["リバースクランチ","腹・体幹","回",0],
 ["ディップスランニング","腹・体幹","秒",0],["マウンテンクライマー","腹・体幹","回",0],["ゲットアップ","腹・体幹","左右回",0],
 ["ゴムバンド上げ下げ","腹・体幹","回",0],["ヒップヒンジ","腹・体幹","左右回",0]
].map(function(a){return {n:a[0],p:a[1],u:a[2],m:!!a[3]};});

/* 曜日(0=日)ごとのメニュー: [種目, 重量, 回数, セット] */
var DEFAULT_PROGRAM={
 name:"4週間プログラム",start:"2026-09-21",weeks:4,version:2,
 days:{
  "1":{label:"押す（重め）",items:[["チェストプレス",25,"8-10",3],["インクラインチェストプレス",15,"8-10",3],["ペックデッキフライ",25,"8-10",3],["ショルダープレス",15,"8-10",3],["アシストディップス",40,"6-8",3]]},
  "2":{label:"引く＋腕",items:[["ラットプルダウン",32,"8-10",3],["シーテッドケーブルロウ",32,"8-10",3],["ディップチンアシスト",40,"6-8",3],["リアデルトフライ",20,"10",3],["アームカール",10,"10",3]]},
  "3":{label:"脚・腹（重め）",items:[["レッグプレス",47,"8-10",3],["シーテッドレッグカール",20,"10",3],["ヒップスラスト",32,"8-10",4],["レッグエクステンション",25,"10",3],["アブドミナルクランチ",47,"10",3]]},
  "5":{label:"押す（軽め）",items:[["チェストプレス",20,"10",3],["インクラインチェストプレス",15,"10",3],["ショルダープレス",15,"10",3],["アシストディップス",47,"8-10",3],["アームカール",10,"10",3]]},
  "6":{label:"脚・腹（軽め）",items:[["シーテッドレッグカール",20,"10",3],["ヒップアブダクション",32,"10",3],["ヒップスラスト",25,"10",3],["シーテッドケーブルロウ",32,"10",3],["アブドミナルクランチ",32,"10",3]]}
 },
 phases:["あと2回残して終える","あと1〜2回残して終える","上限達成種目のみ1段階増量、あと2回残す","あと1回残して終える"],
 after:"全種目3→2セットの軽い週"
};

/* ---------- 日付 ---------- */
function pad(n){return (n<10?"0":"")+n;}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]||1);}
function ymOf(s){return s.slice(0,7);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d);}
function addMonths(ym,n){var d=parse(ym+"-01");d.setMonth(d.getMonth()+n);return fmt(d).slice(0,7);}
function daysIn(ym){var d=parse(ym+"-01");return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ---------- 保存 ---------- */
var docs={};          // name -> data
var loaded={};        // name -> true
/* 端末内保存（単体版）：IndexedDB */
var idb={h:null,
  open:function(){
    var self=this;
    return new Promise(function(res,rej){
      if(!window.indexedDB) return rej(new Error("no indexedDB"));
      var r=indexedDB.open("kintore",1);
      r.onupgradeneeded=function(){r.result.createObjectStore("docs");};
      r.onsuccess=function(){self.h=r.result;res();};
      r.onerror=function(){rej(r.error);};
    });
  },
  tx:function(mode,fn){
    var self=this;
    return new Promise(function(res,rej){
      var t=self.h.transaction("docs",mode),st=t.objectStore("docs"),out;
      var q=fn(st);if(q) q.onsuccess=function(){out=q.result;};
      t.oncomplete=function(){res(out);};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error);};
    });
  },
  get:function(n){return this.tx("readonly",function(st){return st.get(n);});},
  set:function(n,d){return this.tx("readwrite",function(st){st.put(d,n);});}
};
var store={mode:"local",db:null,uid:null,
  path:function(n){return "data/users/"+this.uid+"/"+n;},
  localGet:function(n){try{var v=localStorage.getItem("kintore:"+n);return v?JSON.parse(v):null;}catch(e){return null;}},
  localSet:function(n,d){try{localStorage.setItem("kintore:"+n,JSON.stringify(d));}catch(e){}},
  get:function(n){
    var self=this;
    if(self.mode==="idb") return idb.get(n).then(function(v){return v!=null?v:self.localGet(n);},function(){return self.localGet(n);});
    if(self.mode!=="db") return Promise.resolve(self.localGet(n));
    return self.db.doc(self.path(n)).get().then(function(s){
      return s.exists?JSON.parse(JSON.stringify(s.data())):null;
    }).catch(function(){return self.localGet(n);});
  },
  set:function(n,d){
    if(this.mode==="idb") return idb.set(n,JSON.parse(JSON.stringify(d)));
    this.localSet(n,d);
    if(this.mode!=="db") return Promise.resolve();
    return this.db.doc(this.path(n)).set(d);
  }
};
var timers={},busy={};
function markDirty(n){
  if(store.mode!=="idb") store.localSet(n,docs[n]);
  clearTimeout(timers[n]);
  timers[n]=setTimeout(function(){flush(n);},700);
}
function flush(n){
  if(busy[n]){busy[n]="again";return;}
  busy[n]=true;
  store.set(n,docs[n]).then(function(){setStatus(null);},function(e){

/* ---------- 集計 ---------- */
function doneSets(entry){return (entry.sets||[]).filter(function(s){return s.r!==""&&s.r!=null&&Number(s.r)>0;});}
function dayHasLift(day){return day&&(day.entries||[]).some(function(e){return doneSets(e).length>0;});}
function monthStats(ym){
  var m=monthDoc(ym),out={lift:0,run:0,active:0,sets:0,parts:{},ex:{},days:{}};
  PARTS.forEach(function(p){out.parts[p]=0;});
  Object.keys(m.days||{}).sort().forEach(function(k){
    if(ymOf(k)!==ym) return;
    var d=m.days[k],lift=dayHasLift(d);
    var run=SHOW_RUN&&!!d.run;
    if(lift) out.lift++; if(run) out.run++; if(lift||run) out.active++;
    out.days[k]={lift:lift,run:run,rest:!!d.rest};
    (d.entries||[]).forEach(function(e){
      var ds=doneSets(e);if(!ds.length) return;
      var info=exInfo(e.ex);
      out.sets+=ds.length;out.parts[info.p]=(out.parts[info.p]||0)+ds.length;
      var x=out.ex[e.ex]||(out.ex[e.ex]={name:e.ex,part:info.p,unit:info.u,days:[],sets:0,last:null});
      if(x.days.indexOf(k)<0) x.days.push(k);
      x.sets+=ds.length;x.last=ds;
    });
  });
  return out;
}
function setsSummary(sets,unit){
  if(!sets||!sets.length) return "";
  var w=sets.map(function(s){return s.w;}),r=sets.map(function(s){return s.r;});
  var sameW=w.every(function(v){return v===w[0];}),sameR=r.every(function(v){return String(v)===String(r[0]);});
  var u=unit==="左右回"?"回":unit, pre=unit==="左右回"?"左右":"";
  var wt=(w[0]!==""&&w[0]!=null&&w[0]!==0)?w[0]+"kg ":"";
  if(sameW&&sameR) return wt+pre+r[0]+u+"×"+sets.length;
  if(sameW) return wt+pre+r.join(",")+u;
  return sets.map(function(s){return (s.w?s.w+"×":"")+s.r;}).join(", ");
}

function weekInfo(dateStr){
  var p=program();if(!p||!p.start) return null;
  var diff=Math.round((parse(dateStr)-parse(p.start))/86400000);
  if(diff<0) return null;
  var w=Math.floor(diff/7)+1;
  if(w<=p.weeks) return {w:w,text:w+"週目",phase:(p.phases||[])[w-1]||""};
  if(w===p.weeks+1&&p.after) return {w:w,text:"プログラム後の1週",phase:p.after};
  return null;
}

}

var MAX_REPS=10;
function stagesFor(name){var l=STAGES.concat(EXTRA[name]||[]);return l.filter(function(v,i){return l.indexOf(v)===i;}).sort(function(a,b){return a-b;});}
function stepWeight(name,w,dir){
  var l=stagesFor(name),v=Number(w),i=l.indexOf(v);
  if(i<0){i=0;while(i<l.length-1&&l[i]<v) i++;if(dir>0&&l[i]>v) return l[i];if(dir<0&&l[i]>v) i--;}
  return l[Math.max(0,Math.min(l.length-1,i+dir))];
}
function upperOf(tr){var m=String(tr||"").match(/(\d+)\s*$/);return m?Math.min(MAX_REPS,Number(m[1])):null;}
/* その日にやった内容が、どの曜日のメニューに一番近いか（曜日をずらして行った日も正しく扱う） */
function menuOf(ds,day){
  var p=program();if(!p) return null;
  var names=(day.entries||[]).filter(function(e){return doneSets(e).length;}).map(function(e){return e.ex;});
  var best=null,bestN=0,own=String(parse(ds).getDay());
  Object.keys(p.days).forEach(function(k){
    var n=p.days[k].items.filter(function(it){return names.indexOf(it[0])>=0;}).length;
    if(n>bestN||(n===bestN&&n>0&&k===own)){best=k;bestN=n;}
  });
  return bestN>=3?best:null;
}
function findLast(name,beforeDate,sameDow){
  var want=String(parse(beforeDate).getDay());
  for(var k=1;k<=84;k++){
    var ds=addDays(beforeDate,-k),m=docs["m-"+ymOf(ds)];
    if(!m||!m.days||!m.days[ds]) continue;
    if(sameDow){var mk=menuOf(ds,m.days[ds]);if(mk===null?k%7:mk!==want) continue;}
    var es=m.days[ds].entries||[];
    for(var i=0;i<es.length;i++) if(es[i].ex===name&&doneSets(es[i]).length) return {date:ds,entry:es[i]};
  }
  return null;
}
/* 前回の同じ曜日の記録から、今回の重量を決める */
function suggest(name,baseW,tr,ts,sameDow,deload){
  var info=exInfo(name),last=findLast(name,curDate,sameDow);
  if(!last&&sameDow===true) last=null;
  if(!last||!info.m) return {w:baseW,last:last};
  var ds=doneSets(last.entry),lw=Number(ds[0].w);
  if(isNaN(lw)||ds[0].w==="") return {w:baseW,last:last};
  var up=upperOf(tr)||upperOf(last.entry.tr),planned=last.entry.ts||ds.length;
  var hit=!!up&&ds.length>=planned&&ds.every(function(x){return Number(x.r)>=up&&Number(x.w)===lw;});
  if(hit&&!deload){
    var assist=ASSIST.indexOf(name)>=0,nw=stepWeight(name,lw,assist?-1:1);
    if(nw!==lw) return {w:nw,up:{from:lw,to:nw,reps:up,assist:assist},last:last};
  }
  return {w:lw,last:last};
}
function addSuggested(name,baseW,tr,ts,sameDow,deload){
  var sg=suggest(name,baseW,tr,ts,sameDow,deload);
  addEntry(name,sg.w,tr,ts);
  var e=getDay(curDate,true).entries.slice(-1)[0];
  if(sg.last){var d=parse(sg.last.date);e.prev=(d.getMonth()+1)+"/"+d.getDate()+"："+setsSummary(doneSets(sg.last.entry),exInfo(name).u);}
  if(sg.up) e.up=sg.up;
}
function insertPlan(){
  var plan=program().days[String(parse(curDate).getDay())];if(!plan) return;
  var wi=weekInfo(curDate),deload=!!(wi&&wi.w===program().weeks+1);
  plan.items.forEach(function(it){addSuggested(it[0],it[1],it[2],deload?2:it[3],true,deload);});
}
function addEntry(name,tw,tr,ts){
  var day=getDay(curDate,true),n=ts||3,sets=[];
  for(var i=0;i<n;i++) sets.push({w:tw!=null?tw:"",r:""});
  day.entries.push({ex:name,tw:tw!=null?tw:null,tr:tr||"",ts:ts||null,sets:sets,feel:""});
  day.rest=false;
}

function rerender(){
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-current",b.dataset.tab===view?"page":"false");});
  if(!settings()){app.innerHTML='<p class="status">読み込み中…</p>';return;}
  if(view==="rec") renderRec();
  else if(view==="cal") renderCal();
  else if(view==="parts") renderParts();
  else if(view==="ex") renderEx();
  else renderMore();
}
function go(){
  var need=[ensure("settings",defaultSettings)];
  if(view==="rec") need.push(loadMonth(ymOf(curDate)),loadMonth(addMonths(ymOf(curDate),-1)),loadMonth(addMonths(ymOf(curDate),-2)));
  else if(view==="parts") need.push(loadMonth(statYm),loadMonth(addMonths(statYm,-1)));
  else if(view!=="more") need.push(loadMonth(statYm));
  return Promise.all(need).then(function(){
    var st=settings();
    if(st&&(!st.program||st.program.version!==DEFAULT_PROGRAM.version)){st.program=JSON.parse(JSON.stringify(DEFAULT_PROGRAM));markDirty("settings");}
    if(view==="rec"&&curDate===today&&!getDay(today,false)&&program().days[String(parse(today).getDay())]){insertPlan();saveDay(today);}
    rerender();
  });
}

function handleAct(b){
  var a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,day;
  if(a==="day"){curDate=addDays(curDate,+b.dataset.n);go();return;}
  if(a==="today"){curDate=today;go();return;}
  if(a==="month"){statYm=addMonths(statYm,+b.dataset.n);go();return;}
  if(a==="side"){bodySide=b.dataset.v;rerender();return;}
  if(a==="goDay"){curDate=b.dataset.d;view="rec";window.scrollTo(0,0);go();return;}
  if(a==="openAdd"){openAdd();return;}
  if(a==="closeSheet"){closeSheet();return;}
  if(a==="pick"){var pi=exInfo(b.dataset.n);addSuggested(b.dataset.n,null,pi.m?"8-10":"",3,false,false);saveDay(curDate);closeSheet();renderRec();return;}
  if(a==="newEx"){
    var nm=(document.getElementById("nxName").value||"").trim();
    if(!nm){document.getElementById("nxName").focus();return;}
    if(!exList().some(function(e){return e.n===nm;})){
      exList().push({n:nm,p:document.getElementById("nxPart").value,u:document.getElementById("nxUnit").value,m:document.getElementById("nxM").value==="1"});
      markDirty("settings");
    }
    addEntry(nm,null,"",3);saveDay(curDate);closeSheet();renderRec();return;
  }
  if(a==="plan"){
    insertPlan();saveDay(curDate);renderRec();return;
  }
  if(a==="run"||a==="rest"){
    day=getDay(curDate,true);day[a]=!day[a];
    if(a==="rest"&&day.rest) day.run=day.run; 
    saveDay(curDate);renderRec();return;
  }
  if(["showJson","export","import"].indexOf(a)<0) day=getDay(curDate,true);
  if(a==="delEntry"){
    if(!confirm(day.entries[i].ex+"をこの日の記録から削除しますか？")) return;
    day.entries.splice(i,1);saveDay(curDate);renderRec();return;
  }
  if(a==="addSet"){var e=day.entries[i],last=e.sets[e.sets.length-1];e.sets.push({w:last?last.w:(e.tw!=null?e.tw:""),r:""});saveDay(curDate);renderRec();return;}
  if(a==="delSet"){day.entries[i].sets.splice(j,1);saveDay(curDate);renderRec();return;}
  if(a==="fill"){var en=day.entries[i],s0=en.sets[0];if(!s0) return;en.sets.forEach(function(s){s.w=s0.w;s.r=s0.r;});saveDay(curDate);renderRec();return;}
  if(a==="feel"){var ee=day.entries[i];ee.feel=ee.feel===b.dataset.v?"":b.dataset.v;saveDay(curDate);renderRec();return;}
  if(a==="showJson"){buildBackup().then(function(bk){var t=document.getElementById("json");t.style.display="block";t.value=JSON.stringify(bk,null,1);t.select();});return;}
  if(a==="export"){buildBackup().then(function(bk){
    var name="kintore-backup-"+today+".json",data=JSON.stringify(bk,null,1);
    if(downloadsCap) return downloadsCap.save({filename:name,data:data});
    var url=URL.createObjectURL(new Blob([data],{type:"application/json"})),a2=document.createElement("a");
    a2.href=url;a2.download=name;document.body.appendChild(a2);a2.click();a2.remove();setTimeout(function(){URL.revokeObjectURL(url);},2000);
  }).catch(function(){});return;}
  if(a==="import"){
    var msg=document.getElementById("impmsg"),bk;
    try{bk=JSON.parse(b.dataset.json||document.getElementById("imp").value);}catch(e){msg.textContent="JSONとして読み取れませんでした。書き出した内容をそのまま貼り付けてください。";return;}
    if(!bk||!bk.months){msg.textContent="このアプリのバックアップではありません（months がありません）。";return;}
    if(!confirm("バックアップの内容で、含まれている月の記録を置き換えます。よろしいですか？")) return;
    if(bk.settings&&bk.settings.exercises){docs.settings=bk.settings;loaded.settings=true;markDirty("settings");}
    Object.keys(bk.months).forEach(function(k){docs["m-"+k]=bk.months[k];loaded["m-"+k]=true;markDirty("m-"+k);});
    msg.textContent=Object.keys(bk.months).length+"か月分を読み込みました。";
    return;
  }
}

    var db=r[0],user=r[1];
    if(!db||!user) return null;
    return user.id().then(function(id){
      if(!id) return null;
      store.db=db;store.uid=id;store.mode="db";
      // 端末内の記録とアカウント側の記録を合わせて読み直す
      var names=Object.keys(loaded);
      var localCopy={};names.forEach(function(n){localCopy[n]=docs[n];});
      loaded={};docs={};
      return Promise.all(names.map(function(n){
        return store.get(n).then(function(d){
          var local=localCopy[n];
          if(d){docs[n]=d;}
          else{docs[n]=local;if(local&&(n==="settings"||(local.days&&Object.keys(local.days).length))) flush(n);}
          loaded[n]=true;
        });
      }));
    });
  }).then(function(){go();},function(){go();});
})();
})();
</script>
