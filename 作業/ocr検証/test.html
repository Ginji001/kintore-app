<!doctype html><meta charset="utf-8"><body><script src="bodyocr.js"></script><script>
async function run(names){const out={};for(const n of names){const b=await (await fetch('img/'+n)).blob();const f=new File([b],n,{type:'image/jpeg'});const t=performance.now();try{out[n]=await BOCR.read(f);}catch(e){out[n]={err:String(e)}}out[n].ms=Math.round(performance.now()-t);}return out;}
</script>
